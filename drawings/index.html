  <div class="polaroid-overlay" id="polaroid-overlay">
    <div class="polaroid" id="polaroid">
      <div class="polaroid-image-container" id="polaroid-image-container">
        <img class="polaroid-image" id="polaroid-image" src="" alt="">
      </div>
      <div class="polaroid-info" id="polaroid-info"></div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>

<script>
  gsap.registerPlugin(Flip);

  
  function setupImageFadeIn() {
    const images = document.querySelectorAll('.gallery-image');
    const staggerDelay = 30;
    
    images.forEach((img, index) => {
      function fadeIn() {
        setTimeout(() => {
          img.classList.add('loaded');
        }, index * staggerDelay);
      }
      
      if (img.complete) {
        fadeIn();
      } else {
        img.addEventListener('load', fadeIn);
        img.addEventListener('error', fadeIn);
      }
    });
  }
  
  
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const grid = document.getElementById('drawings-grid');
      grid.classList.remove('gallery-hidden');
      setupImageFadeIn();
    });
  });

  
  const drawingsGrid = document.getElementById('drawings-grid');
  const allDrawingsItems = document.querySelectorAll('.gallery-item');
  const sizeButtons = document.querySelectorAll('.size-buttons button');

  
  let animated = false;
  let currentGridSize = drawingsGrid.dataset.sizeGrid || "100%";
  let isPolaroidOpen = false;

  
  sizeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      
      if (animated || isPolaroidOpen) return;

      
      const targetSize = btn.dataset.size;

      
      if (targetSize === currentGridSize) return;

      
      animated = true;

      
      const state = Flip.getState(allDrawingsItems);

      
      drawingsGrid.dataset.sizeGrid = targetSize;
      currentGridSize = targetSize;

      
      sizeButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');

      const flipDuration = 1;
      const staggerAmount = 0.3;
      const totalFlipDuration = flipDuration + staggerAmount;

      
      const scrollY = window.scrollY;
      const containerHeight = drawingsGrid.offsetHeight;
      drawingsGrid.style.minHeight = containerHeight + 'px';

      
      Flip.from(state, {
        absolute: true,
        duration: flipDuration,
        ease: "expo.inOut",
        onComplete: () => {
          
          drawingsGrid.style.minHeight = '';
          animated = false;
        },
        stagger: {
          amount: staggerAmount,
          from: "random",
        },
      }).fromTo(
        drawingsGrid,
        {
          filter: "blur(0px)",
        },
        {
          duration: totalFlipDuration,
          keyframes: [
            {
              filter: "blur(10px)",
              duration: totalFlipDuration * 0.5,
              ease: "power2.in",
            },
            {
              filter: "blur(0px)",
              duration: totalFlipDuration * 0.5,
              ease: "power2",
              delay: 0.5,
            },
          ],
        },
        0
      );
    });
  });

  
  
  
  
  const polaroidOverlay = document.getElementById('polaroid-overlay');
  const polaroid = document.getElementById('polaroid');
  const polaroidImageContainer = document.getElementById('polaroid-image-container');
  const polaroidImage = document.getElementById('polaroid-image');
  const polaroidInfo = document.getElementById('polaroid-info');
  
  let currentImageRect = null;
  let scrollStart = 0;
  let polaroidLoadToken = 0;

  function getPolaroidMaxSize() {
    const mobile = window.matchMedia('(max-width: 767px)').matches;
    return {
      maxW: mobile ? window.innerWidth * 0.85 : Math.min(window.innerWidth * 0.7, 800),
      maxH: mobile ? window.innerHeight * 0.6 : window.innerHeight * 0.65,
    };
  }

  function sizePolaroidFrame(w, h) {
    const width = Math.max(1, Number(w) || 1);
    const height = Math.max(1, Number(h) || 1);
    const { maxW, maxH } = getPolaroidMaxSize();
    const scale = Math.min(maxW / width, maxH / height, 1);
    polaroidImageContainer.style.width = Math.round(width * scale) + 'px';
    polaroidImageContainer.style.height = Math.round(height * scale) + 'px';
  }

  function loadPolaroidImage(fullSrc, alt, w, h) {
    const token = ++polaroidLoadToken;
    polaroidImage.classList.remove('is-visible');
    polaroidImageContainer.classList.add('is-loading');
    polaroidImageContainer.classList.remove('is-loaded');
    polaroidImage.removeAttribute('src');
    polaroidImage.alt = alt || '';
    sizePolaroidFrame(w, h);

    const finish = () => {
      if (token !== polaroidLoadToken) return;
      polaroidImageContainer.classList.remove('is-loading');
      polaroidImageContainer.classList.add('is-loaded');
      requestAnimationFrame(() => {
        polaroidImage.classList.add('is-visible');
      });
    };

    polaroidImage.onload = finish;
    polaroidImage.onerror = finish;
    polaroidImage.src = fullSrc;
    if (polaroidImage.complete && polaroidImage.naturalWidth) {
      finish();
    }
  }

  
  allDrawingsItems.forEach((item) => {
    item.addEventListener('click', (e) => {
      if (animated || isPolaroidOpen) return;
      
      const img = item.querySelector('.gallery-image');
      const title = item.dataset.title;
      const mediums = item.dataset.mediums;
      const date = item.dataset.date;
      
      
      currentImageRect = img.getBoundingClientRect();
      scrollStart = window.scrollY;
      
      
      loadPolaroidImage(
        img.dataset.full || img.src,
        img.alt,
        img.getAttribute('width') || img.naturalWidth,
        img.getAttribute('height') || img.naturalHeight
      );
      
      
      const infoParts = [title, mediums, date].filter(Boolean);
      if (infoParts.length > 0) {
        polaroidInfo.textContent = infoParts.join(' • ');
        polaroidInfo.style.display = 'block';
      } else {
        polaroidInfo.style.display = 'none';
      }
      
      
      openPolaroid();
    });
  });

  function openPolaroid() {
    isPolaroidOpen = true;
    
    
    gsap.killTweensOf(polaroid);
    gsap.killTweensOf(polaroidOverlay);
    
    
    polaroid.style.opacity = '';
    
    
    gsap.set(polaroidOverlay, { opacity: 0 });
    gsap.set(polaroid, { scale: 0.85 });
    
    
    polaroidOverlay.classList.add('active');
    
    
    gsap.to(polaroidOverlay, { 
      opacity: 1, 
      duration: 0.3, 
      ease: "power2.out" 
    });
    
    
    gsap.to(polaroid, {
      scale: 1,
      duration: 0.45,
      ease: "power2.out",
    });
    
    
    document.addEventListener('mousemove', handleMouseMove);
    
    
    window.addEventListener('scroll', handleScroll);
  }

  function closePolaroid() {
    if (!isPolaroidOpen) return;
    
    isPolaroidOpen = false;
    polaroidLoadToken += 1;
    
    
    document.removeEventListener('mousemove', handleMouseMove);
    window.removeEventListener('scroll', handleScroll);
    
    
    gsap.to(polaroid, {
      scale: 0.85,
      rotateX: 0,
      rotateY: 0,
      duration: 0.3,
      ease: "power3.in",
    });
    
    
    gsap.to(polaroidOverlay, {
      opacity: 0,
      duration: 0.3,
      ease: "power3.in",
      onComplete: () => {
        polaroidOverlay.classList.remove('active');
        
        gsap.set(polaroidOverlay, { opacity: '' });
        gsap.set(polaroid, { rotateX: 0, rotateY: 0, scale: 1 });
        polaroid.style.opacity = '';
        polaroidImage.classList.remove('is-visible');
        polaroidImage.removeAttribute('src');
        polaroidImageContainer.classList.remove('is-loading', 'is-loaded');
        polaroidImageContainer.style.width = '';
        polaroidImageContainer.style.height = '';
      }
    });
  }

  const tiltStrength = 15;

  
  let shine = null;
  function getShine() {
    if (!shine) {
      shine = polaroid.querySelector('.polaroid-shine');
      if (!shine) {
        shine = document.createElement('div');
        shine.className = 'polaroid-shine';
        polaroid.appendChild(shine);
      }
    }
    return shine;
  }

  
  function applyPolaroidTilt(clientX, clientY) {
    
    gsap.killTweensOf(polaroid);
    gsap.killTweensOf(getShine());
    
    const rect = polaroid.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const percentX = (clientX - centerX) / (rect.width / 2);
    const percentY = (clientY - centerY) / (rect.height / 2);

    const tiltX = -percentY * tiltStrength;
    const tiltY = percentX * tiltStrength;

    
    polaroid.style.transform = `
      perspective(1000px)
      rotateX(${tiltX}deg)
      rotateY(${tiltY}deg)
      scale(1.02)
    `;

    
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const xPercent = (x / rect.width) * 100;
    const yPercent = (y / rect.height) * 100;
    
    const shineEl = getShine();
    shineEl.style.background = `radial-gradient(circle at ${xPercent}% ${yPercent}%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.15) 40%, transparent 80%)`;
    shineEl.style.opacity = '1';
  }

  function resetPolaroidTilt() {
    gsap.to(polaroid, {
      rotateX: 0,
      rotateY: 0,
      scale: 1,
      duration: 0.5,
      ease: "power2.out",
      onComplete: () => {
        polaroid.style.transform = '';
      }
    });
    const shineEl = getShine();
    gsap.to(shineEl, {
      opacity: 0,
      duration: 0.4,
      ease: "power2.out"
    });
  }

  
  function handleMouseMove(e) {
    if (!isPolaroidOpen) return;
    
    const rect = polaroid.getBoundingClientRect();
    const mouseX = e.clientX;
    const mouseY = e.clientY;
    
    
    const isOverPolaroid = (
      mouseX >= rect.left &&
      mouseX <= rect.right &&
      mouseY >= rect.top &&
      mouseY <= rect.bottom
    );
    
    if (isOverPolaroid) {
      applyPolaroidTilt(mouseX, mouseY);
    } else {
      resetPolaroidTilt();
    }
  }

  
  function handleScroll() {
    const scrollDiff = Math.abs(window.scrollY - scrollStart);
    if (scrollDiff > 50) {
      closePolaroid();
    }
  }

  
  polaroidOverlay.addEventListener('click', (e) => {
    if (e.target === polaroidOverlay) {
      closePolaroid();
    }
  });

  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isPolaroidOpen) {
      closePolaroid();
    }
  });
</script>
